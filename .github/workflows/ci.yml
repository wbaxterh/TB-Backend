name: CI

on:
  pull_request:
    branches:
      - master
      - staging
  push:
    branches:
      - master
      - staging

jobs:
  production-promotion:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Require staging as the production source
        run: test "${{ github.head_ref }}" = "staging"

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate
